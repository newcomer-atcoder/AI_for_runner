<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>app init page</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Meiryo", sans-serif;
      background: linear-gradient(180deg, #060c18 0%, #0a1628 40%, #0f2040 70%, #060c18 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      color: #cbd5e1;
    }

    /* ランナーシルエット共通 */
    .runner-bg {
      position: absolute;
      bottom: 0;
      z-index: 0;
    }
    .runner-bg svg {
      fill: #1e4a7a;
      display: block;
    }

    .runner-1 { left:  1%; width: 140px; opacity: 0.45; }
    .runner-2 { left: 18%; width: 210px; opacity: 0.35; }
    .runner-3 { left: 42%; width: 170px; opacity: 0.28; }
    .runner-4 { left: 63%; width: 250px; opacity: 0.40; }
    .runner-5 { left: 82%; width: 130px; opacity: 0.32; }

    .header {
      width: 100%;
      background-color: #030810;
      color: #e2e8f0;
      padding: 12px 20px;
      font-size: 20px;
      font-weight: bold;
      text-align: left;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      border-bottom: 1px solid #1e3a5f;
    }

    .center-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    .message-box {
      width: 520px;
      padding: 20px 24px;
      background-color: #0d2340;
      color: #cbd5e1;
      border: 1px solid #1e4a7a;
    }

    .message-title {
      margin-bottom: 12px;
      font-size: 24px;
      font-weight: bold;
      color: #e2e8f0;
    }

    .message-line {
      margin-bottom: 12px;
      font-size: 14px;
      color: #94a3b8;
    }

    .radio-group {
      margin-left: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      color: #94a3b8;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      width: 100%;
    }

    .btn-next {
      width: 140px;
      height: 36px;
      background-color: #1e4a7a;
      color: #e2e8f0;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-exit {
      width: 140px;
      height: 36px;
      background-color: #7a1e1e;
      color: #e2e8f0;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
  <script src="{{url_for('url_static', path='commonFuncs.js')}}"></script>
  <script src="{{url_for('url_static', path='app_init_funcs.js')}}"></script>
</head>
<body>

  <!-- ランナーシルエット（背景） -->
  <div class="runner-bg runner-1">
    <svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
      <circle cx="63" cy="13" r="11"/>
      <path d="M63,24 C57,30 53,43 49,62 L58,65 C60,48 66,35 70,28 Z"/>
      <path d="M65,33 L79,55 L83,52 L69,30 Z"/>
      <path d="M62,30 L46,19 L44,23 L60,35 Z"/>
      <path d="M49,62 L39,84 L28,101 L35,104 L47,87 L58,65 Z"/>
      <path d="M54,63 L58,87 L66,103 L73,100 L66,83 L62,61 Z"/>
    </svg>
  </div>
  <div class="runner-bg runner-2">
    <svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
      <circle cx="63" cy="13" r="11"/>
      <path d="M63,24 C57,30 53,43 49,62 L58,65 C60,48 66,35 70,28 Z"/>
      <path d="M65,33 L79,55 L83,52 L69,30 Z"/>
      <path d="M62,30 L46,19 L44,23 L60,35 Z"/>
      <path d="M49,62 L39,84 L28,101 L35,104 L47,87 L58,65 Z"/>
      <path d="M54,63 L58,87 L66,103 L73,100 L66,83 L62,61 Z"/>
    </svg>
  </div>
  <div class="runner-bg runner-3">
    <svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
      <circle cx="63" cy="13" r="11"/>
      <path d="M63,24 C57,30 53,43 49,62 L58,65 C60,48 66,35 70,28 Z"/>
      <path d="M65,33 L79,55 L83,52 L69,30 Z"/>
      <path d="M62,30 L46,19 L44,23 L60,35 Z"/>
      <path d="M49,62 L39,84 L28,101 L35,104 L47,87 L58,65 Z"/>
      <path d="M54,63 L58,87 L66,103 L73,100 L66,83 L62,61 Z"/>
    </svg>
  </div>
  <div class="runner-bg runner-4">
    <svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
      <circle cx="63" cy="13" r="11"/>
      <path d="M63,24 C57,30 53,43 49,62 L58,65 C60,48 66,35 70,28 Z"/>
      <path d="M65,33 L79,55 L83,52 L69,30 Z"/>
      <path d="M62,30 L46,19 L44,23 L60,35 Z"/>
      <path d="M49,62 L39,84 L28,101 L35,104 L47,87 L58,65 Z"/>
      <path d="M54,63 L58,87 L66,103 L73,100 L66,83 L62,61 Z"/>
    </svg>
  </div>
  <div class="runner-bg runner-5">
    <svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
      <circle cx="63" cy="13" r="11"/>
      <path d="M63,24 C57,30 53,43 49,62 L58,65 C60,48 66,35 70,28 Z"/>
      <path d="M65,33 L79,55 L83,52 L69,30 Z"/>
      <path d="M62,30 L46,19 L44,23 L60,35 Z"/>
      <path d="M49,62 L39,84 L28,101 L35,104 L47,87 L58,65 Z"/>
      <path d="M54,63 L58,87 L66,103 L73,100 L66,83 L62,61 Z"/>
    </svg>
  </div>

  <div class="header">🏃AI_for_runner</div>
  <div class="center-wrapper">

    <div class="message-title">🏃こんにちは、あなたのランニングを支援します</div>

    <div class="message-box">
      <div class="message-line">AIに過去のランニング記録を入力しますか？（y/n）:</div>

      <div class="radio-group">
        <label>
          <input type="radio" name="run_option" value="y" checked>
          y：ランニング記録の入力に進む
        </label>

        {% if not dbsetup_flg %}
        <label>
          <input type="radio" name="run_option" value="n">
          n：AIが本日の走行距離（km）を算出します
        </label>
        {% endif %}
      </div>
    </div>

    <div class="buttons">
      <button type="button" class="btn-next" onclick="goto_nextPage()">次へ進む</button>
      <button type="button" class="btn-exit" onclick="exitApp()">アプリ終了</button>
    </div>
  </div>
</body>
</html>
