<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>app entry page</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Meiryo", sans-serif;
      background: linear-gradient(180deg, #060c18 0%, #0a1628 40%, #0f2040 70%, #060c18 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      color: #cbd5e1;
    }

    /* ランナーシルエット共通 */
    .runner-bg {
      position: absolute;
      bottom: 0;
      z-index: 0;
    }
    .runner-bg svg {
      fill: #1e4a7a;
      display: block;
    }

    .runner-1 { left:  1%; width: 140px; opacity: 0.45; }
    .runner-2 { left: 18%; width: 210px; opacity: 0.35; }
    .runner-3 { left: 42%; width: 170px; opacity: 0.28; }
    .runner-4 { left: 63%; width: 250px; opacity: 0.40; }
    .runner-5 { left: 82%; width: 130px; opacity: 0.32; }

    /* ヘッダー */
    .header {
      width: 100%;
      background-color: #030810;
      color: #e2e8f0;
      padding: 12px 20px;
      font-size: 20px;
      font-weight: bold;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      border-bottom: 1px solid #1e3a5f;
    }

    /* 中央のフォーム全体 */
    .center-wrapper {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    /* フォーム入力エリア */
    .form-box {
      width: 520px;
      padding: 20px 24px;
      background-color: #0d2340;
      border: 1px solid #1e4a7a;
    }

    .title {
      font-size: 32px;
      margin-bottom: 16px;
      font-weight: bold;
      color: #e2e8f0;
    }

    .form-row {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      font-size: 14px;
      color: #94a3b8;
    }

    .form-row label {
      width: 160px;
    }

    .form-row input {
      width: 40px;
      padding: 4px;
      background-color: #0f2a4a;
      border: 1px solid #2d5986;
      color: #e2e8f0;
    }

    .unit {
      margin-left: 6px;
    }

    /* ボタン */
    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }

    .btn {
      width: 120px;
      height: 34px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: #e2e8f0;
    }

    .btn-register {
      background-color: #1e4a7a;
    }

    .btn-finish {
      background-color: #1a5c8a;
    }

    .btn-exit {
      background-color: #7a1e1e;
    }

    /* メッセージエリア */
    .message-box {
      width: 520px;
      padding: 16px 20px;
      background-color: #0d2340;
      border: 1px solid #1e4a7a;
      margin-top: 10px;
    }

    .message-title {
      font-weight: bold;
      margin-bottom: 8px;
      color: #94a3b8;
    }

    .message-area input {
      width: 480px;
      height: 80px;
      padding: 4px;
      background-color: #0f2a4a;
      border: 1px solid #2d5986;
      color: #cbd5e1;
    }
  </style>
  <script src="{{url_for('url_static', path='commonFuncs.js')}}"></script>
  <script src="{{url_for('url_static', path='app_entry_funcs.js')}}"></script>
</head>
<body>

  <!-- ランナーシルエット（背景） -->
  <div class="runner-bg runner-1">
    <svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
      <circle cx="63" cy="13" r="11"/>
      <path d="M63,24 C57,30 53,43 49,62 L58,65 C60,48 66,35 70,28 Z"/>
      <path d="M65,33 L79,55 L83,52 L69,30 Z"/>
      <path d="M62,30 L46,19 L44,23 L60,35 Z"/>
      <path d="M49,62 L39,84 L28,101 L35,104 L47,87 L58,65 Z"/>
      <path d="M54,63 L58,87 L66,103 L73,100 L66,83 L62,61 Z"/>
    </svg>
  </div>
  <div class="runner-bg runner-2">
    <svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
      <circle cx="63" cy="13" r="11"/>
      <path d="M63,24 C57,30 53,43 49,62 L58,65 C60,48 66,35 70,28 Z"/>
      <path d="M65,33 L79,55 L83,52 L69,30 Z"/>
      <path d="M62,30 L46,19 L44,23 L60,35 Z"/>
      <path d="M49,62 L39,84 L28,101 L35,104 L47,87 L58,65 Z"/>
      <path d="M54,63 L58,87 L66,103 L73,100 L66,83 L62,61 Z"/>
    </svg>
  </div>
  <div class="runner-bg runner-3">
    <svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
      <circle cx="63" cy="13" r="11"/>
      <path d="M63,24 C57,30 53,43 49,62 L58,65 C60,48 66,35 70,28 Z"/>
      <path d="M65,33 L79,55 L83,52 L69,30 Z"/>
      <path d="M62,30 L46,19 L44,23 L60,35 Z"/>
      <path d="M49,62 L39,84 L28,101 L35,104 L47,87 L58,65 Z"/>
      <path d="M54,63 L58,87 L66,103 L73,100 L66,83 L62,61 Z"/>
    </svg>
  </div>
  <div class="runner-bg runner-4">
    <svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
      <circle cx="63" cy="13" r="11"/>
      <path d="M63,24 C57,30 53,43 49,62 L58,65 C60,48 66,35 70,28 Z"/>
      <path d="M65,33 L79,55 L83,52 L69,30 Z"/>
      <path d="M62,30 L46,19 L44,23 L60,35 Z"/>
      <path d="M49,62 L39,84 L28,101 L35,104 L47,87 L58,65 Z"/>
      <path d="M54,63 L58,87 L66,103 L73,100 L66,83 L62,61 Z"/>
    </svg>
  </div>
  <div class="runner-bg runner-5">
    <svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
      <circle cx="63" cy="13" r="11"/>
      <path d="M63,24 C57,30 53,43 49,62 L58,65 C60,48 66,35 70,28 Z"/>
      <path d="M65,33 L79,55 L83,52 L69,30 Z"/>
      <path d="M62,30 L46,19 L44,23 L60,35 Z"/>
      <path d="M49,62 L39,84 L28,101 L35,104 L47,87 L58,65 Z"/>
      <path d="M54,63 L58,87 L66,103 L73,100 L66,83 L62,61 Z"/>
    </svg>
  </div>

  <!-- ヘッダー -->
  <div class="header">🏃AI_for_runner</div>

  <div class="center-wrapper">
    <div class="title">🏃過去のランニング記録を登録します</div>

    <!-- 入力フォーム -->
    <div class="form-box">
      <div class="message-title">◆入力画面</div>

      <div class="form-row">
        <label>日付 :</label>
        <input id="yyyy" type="text" placeholder="yyyy" value="{{schedule.yyyy}}">
        <span class="unit">年</span>
        <input id="mm" type="text" placeholder="mm" style="margin-left:10px;" value="{{schedule.mm}}">
        <span class="unit">月</span>
        <input id="dd" type="text" placeholder="dd" style="margin-left:10px;" value="{{schedule.dd}}">
        <span class="unit">日</span>
      </div>

      <div class="form-row">
        <label>走行予定の距離 :</label>
        <input id="distance" type="text" value="{{schedule.distance}}">
        <span class="unit">km</span>
      </div>

      <div class="form-row">
        <label>体調 :</label>
        <input id="condition" type="text" value="{{schedule.condition}}">
        <span class="unit">%</span>
      </div>

      <div class="form-row">
        <label>実際に走った距離 :</label>
        <input id="runningDist" type="text" value="{{schedule.runningDist}}">
        <span class="unit">km</span>
      </div>

      <div class="buttons">
        <button class="btn btn-register" onclick="entry_runData()">登録</button>
        <button class="btn btn-finish" onclick="exitEntry()">登録終了</button>
        <button class="btn btn-exit" onclick="exitApp()">アプリ終了</button>
      </div>
    </div>

    <!-- 登録メッセージ -->
    <div class="message-box">
      <div class="message-title">◆登録メッセージ</div>
      <div class="message-area">
        <input type="text" value="{{result}}" readonly>
      </div>
    </div>

  </div>

</body>
</html>
